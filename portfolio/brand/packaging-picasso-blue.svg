<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="ecrin-title">
  <title id="ecrin-title">Zaphira Signature Picasso Blue packaging: blue shopping bag with beige ribbon handles and gold line-art portrait, blue box with beige band and gold Z monogram, matching card</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF0F2"/>
      <stop offset="1" stop-color="#DCE0E5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5878"/>
      <stop offset="1" stop-color="#2B4563"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#253C57"/>
      <stop offset="1" stop-color="#1F334A"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46668A"/>
      <stop offset="1" stop-color="#3B5A7C"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2CBA6"/>
      <stop offset="0.5" stop-color="#EEDDBF"/>
      <stop offset="1" stop-color="#DCC39C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8A46A"/>
      <stop offset="0.5" stop-color="#EBD3A0"/>
      <stop offset="1" stop-color="#B8924F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1C2B3D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Shopping bag -->
  <g filter="url(#shadow)">
    <polygon points="318,78 340,92 340,300 318,292" fill="url(#blueSide)"/>
    <rect x="108" y="78" width="210" height="214" fill="url(#blue)"/>
  </g>
  <rect x="108" y="78" width="210" height="6" fill="#1F334A" opacity="0.35"/>
  <!-- Ribbon handles -->
  <path d="M168 84 C168 22 258 22 258 84" fill="none" stroke="#B89B72" stroke-width="10" stroke-linecap="round" opacity="0.45" transform="translate(4 3)"/>
  <path d="M168 84 C168 22 258 22 258 84" fill="none" stroke="url(#band)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="168" cy="90" r="2.4" fill="#1F334A"/>
  <circle cx="258" cy="90" r="2.4" fill="#1F334A"/>

  <!-- Z monogram + wordmark -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="miter">
    <path d="M172 118 H202 L174 156 H204"/>
    <path d="M178 124 H196 L170 160" stroke-width="1.1"/>
  </g>
  <text x="188" y="186" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-size="17" letter-spacing="5" fill="url(#gold)">ZAPHIRA</text>
  <text x="188" y="199" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.6" letter-spacing="2.2" fill="#D9BE8D">HANDCRAFTED ELEGANCE</text>

  <!-- Gold line-art portrait -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 112 C252 96 272 82 290 86 C310 80 326 96 318 114 C322 128 312 138 306 134"/>
    <path d="M262 112 C252 124 254 144 262 156 C266 170 276 182 290 184 C300 184 306 176 306 166"/>
    <path d="M270 108 C282 98 300 98 312 108"/>
    <path d="M268 128 C273 123 280 123 285 128 C280 132 273 132 268 128 Z"/>
    <circle cx="276.5" cy="128" r="1.6" fill="#D9BE8D" stroke="none"/>
    <path d="M294 126 C298 122 304 122 308 126 C304 130 298 130 294 126 Z"/>
    <circle cx="301" cy="126" r="1.4" fill="#D9BE8D" stroke="none"/>
    <path d="M288 130 C286 142 282 150 288 152 C291 153 293 151 294 150"/>
    <path d="M280 164 C285 160 290 162 292 164 C295 161 300 161 303 164 C298 170 286 170 280 164 Z"/>
    <path d="M281 164 C290 166 296 166 302 164"/>
    <circle cx="296" cy="182" r="4.5"/>
    <path d="M306 166 C312 150 318 142 316 132"/>
  </g>

  <!-- Gift box -->
  <g filter="url(#shadow)">
    <polygon points="46,262 72,240 266,240 240,262" fill="url(#blueTop)"/>
    <polygon points="240,262 266,240 266,326 240,350" fill="url(#blueSide)"/>
    <rect x="46" y="262" width="194" height="88" fill="url(#blue)"/>
  </g>
  <line x1="46" y1="288" x2="240" y2="288" stroke="#1F334A" stroke-width="1" opacity="0.55"/>
  <!-- Beige band -->
  <polygon points="118,262 144,240 196,240 170,262" fill="#E7D3B1"/>
  <rect x="118" y="262" width="52" height="88" fill="url(#band)"/>
  <g fill="none" stroke="#B48E52" stroke-width="1.5">
    <path d="M134 276 H154 L136 300 H156"/>
  </g>
  <text x="144" y="313" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-size="7.5" letter-spacing="2" fill="#A9844A">ZAPHIRA</text>
  <line x1="132" y1="320" x2="156" y2="320" stroke="#B48E52" stroke-width="0.6"/>
  <line x1="136" y1="326" x2="152" y2="326" stroke="#B48E52" stroke-width="0.6"/>

  <!-- Card -->
  <g transform="rotate(-7 312 318)" filter="url(#shadow)">
    <rect x="276" y="284" width="72" height="72" fill="url(#blue)"/>
    <g fill="none" stroke="url(#gold)" stroke-width="1.4">
      <path d="M300 300 H316 L301 320 H317"/>
    </g>
    <path d="M322 296 C330 292 338 300 334 310 C338 318 330 326 324 322" fill="none" stroke="url(#gold)" stroke-width="0.8"/>
    <text x="312" y="336" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-size="8" letter-spacing="2.4" fill="url(#gold)">ZAPHIRA</text>
    <text x="312" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3.2" letter-spacing="1.2" fill="#D9BE8D">HANDCRAFTED ELEGANCE</text>
  </g>

  <!-- Dried sprig -->
  <g fill="none" stroke="#6B7A8C" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <path d="M70 236 C66 200 72 160 86 126"/>
    <path d="M70 200 C60 190 56 180 54 170"/>
    <path d="M72 176 C82 168 88 160 92 150"/>
  </g>
  <g fill="#3E5470" opacity="0.85">
    <circle cx="86" cy="124" r="2.2"/><circle cx="82" cy="132" r="1.8"/><circle cx="91" cy="134" r="1.6"/>
    <circle cx="54" cy="168" r="2"/><circle cx="58" cy="176" r="1.6"/><circle cx="50" cy="178" r="1.4"/>
    <circle cx="92" cy="148" r="2"/><circle cx="96" cy="156" r="1.5"/><circle cx="88" cy="154" r="1.4"/>
  </g>
</svg>
