<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="ecrin-title">
  <title id="ecrin-title">L'Écrin Zaphira: ivory gift box with a champagne ribbon and gold Z monogram</title>
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#EDE3D1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A877"/>
      <stop offset="0.5" stop-color="#E4CDA3"/>
      <stop offset="1" stop-color="#C9A877"/>
    </linearGradient>
    <linearGradient id="ribbonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A877"/>
      <stop offset="0.5" stop-color="#E4CDA3"/>
      <stop offset="1" stop-color="#C9A877"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8925A"/>
      <stop offset="0.5" stop-color="#E2C48E"/>
      <stop offset="1" stop-color="#A9824C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A4A35" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#F6F1E7"/>

  <!-- Box lid -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="260" height="260" rx="6" fill="url(#lid)" stroke="#E2D6C1" stroke-width="1.5"/>
  </g>
  <rect x="80" y="80" width="240" height="240" rx="3" fill="none" stroke="#D9C7A6" stroke-width="0.8" stroke-dasharray="1 4"/>

  <!-- Ribbon, offset from centre for a quieter, asymmetric composition -->
  <rect x="70" y="146" width="260" height="16" fill="url(#ribbon)"/>
  <rect x="236" y="70" width="16" height="260" fill="url(#ribbonV)"/>

  <!-- Bow -->
  <g fill="url(#gold)" opacity="0.92">
    <path d="M244 154 C 214 126, 196 132, 204 150 C 210 162, 228 160, 244 154 Z"/>
    <path d="M244 154 C 274 126, 292 132, 284 150 C 278 162, 260 160, 244 154 Z"/>
    <path d="M240 158 L 222 196 L 232 194 L 238 204 L 244 160 Z"/>
    <path d="M248 158 L 264 194 L 254 193 L 250 203 L 244 160 Z"/>
  </g>
  <circle cx="244" cy="154" r="7" fill="#C9A877" stroke="#B8925A" stroke-width="1"/>

  <!-- Monogram seal -->
  <circle cx="150" cy="248" r="34" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="150" cy="248" r="29" fill="none" stroke="url(#gold)" stroke-width="0.6"/>
  <text x="150" y="263" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="44" font-style="italic" fill="url(#gold)">Z</text>
  <text x="150" y="304" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" letter-spacing="4" fill="#A9824C">ZAPHIRA</text>
</svg>
